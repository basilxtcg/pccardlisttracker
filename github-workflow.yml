name: Update One Piece prices

on:
  schedule:
    - cron: "17 23 * * *"   # once a day, after TCGCSV's daily update
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-onepiece.mjs
      - name: Save new prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/onepiece.json
          git diff --cached --quiet || git commit -m "Daily One Piece prices"
          git push
